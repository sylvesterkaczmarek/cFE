name: Validate background table snapshots
on:
  push:
    branches: [validation/cfe2858-20260926]
permissions:
  contents: read
jobs:
  host-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: validation-source
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: source
          ref: f98a5f0120b5c3ad02c12640b028d9f123925dc8
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install build tools
        run: python -m pip install cmake==3.31.6
      - name: Prepare pinned sources
        run: |
          echo "EVIDENCE_DIR=$GITHUB_WORKSPACE/validation-source/validation/2858" >> "$GITHUB_ENV"
          EVIDENCE_DIR="$GITHUB_WORKSPACE/validation-source/validation/2858" python validation-source/validation/2858/prepare.py
      - name: Configure and build
        run: |
          cd /tmp/cfs
          make SIMULATION=native ENABLE_UNIT_TESTS=true OMIT_DEPRECATED=false prep > "$EVIDENCE_DIR/configure.log" 2>&1
          make -C build -j4 > "$EVIDENCE_DIR/build.log" 2>&1
          cmake --build build/native/default_cpu1 --target coverage-tbl-ALL-testrunner coverage-fs-ALL-testrunner -j4 >> "$EVIDENCE_DIR/build.log" 2>&1
      - name: Uninstrumented component and integration tests
        run: |
          set -o pipefail
          ctest --test-dir /tmp/cfs/build/native/default_cpu1 --no-tests=error -V -R '^(coverage-tbl-|coverage-fs)' > "$EVIDENCE_DIR/native-component-tests.log" 2>&1
          python "$EVIDENCE_DIR/build_cfe_integration.py" > "$EVIDENCE_DIR/native-integration-build.log" 2>&1
          /tmp/cfe-integration/integration > "$EVIDENCE_DIR/native-integration-tests.log" 2>&1
      - name: Instrumented tests and regression pressure checks
        run: |
          set -o pipefail
          cmake -S /tmp/cfs/cfe -B /tmp/cfs/build/native/default_cpu1 -DCMAKE_C_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer' > "$EVIDENCE_DIR/sanitizer-configure.log" 2>&1
          python -u "$EVIDENCE_DIR/verify_cfe_regression.py" | tee "$EVIDENCE_DIR/summary.log"
          cmp source/modules/tbl/fsw/src/cfe_tbl_dump.c /tmp/cfs/cfe/modules/tbl/fsw/src/cfe_tbl_dump.c
          cmp source/modules/fs/fsw/src/cfe_fs_api.c /tmp/cfs/cfe/modules/fs/fsw/src/cfe_fs_api.c
          git -C source diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: background-snapshot-validation
          path: validation-source/validation/2858/*.log
