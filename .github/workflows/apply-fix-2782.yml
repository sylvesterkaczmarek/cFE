name: Apply fix 2782

on:
  push:
    branches:
      - fix-2782-time-print-32bit

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-2782-time-print-32bit

      - name: Apply source and regression-test changes
        shell: python
        run: |
          from pathlib import Path
          import textwrap

          api = Path("modules/time/fsw/src/cfe_time_api.c")
          text = api.read_text()
          start = text.index("CFE_Status_t CFE_TIME_Print(")
          end_marker = "\n}\n\n/*----------------------------------------------------------------"
          end = text.index(end_marker, start) + 2
          new = textwrap.dedent("""
              static void CFE_TIME_UnixSecondsToTm(struct tm *Time, uint64 UnixSeconds)
              {
                  uint64 Days;
                  uint32 SecondsOfDay;
                  uint32 Year;
                  uint32 DaysInYear;

                  Days         = UnixSeconds / 86400;
                  SecondsOfDay = UnixSeconds % 86400;
                  Year         = 1970;

                  while (true)
                  {
                      DaysInYear = 365;
                      if (((Year % 4) == 0) && (((Year % 100) != 0) || ((Year % 400) == 0)))
                      {
                          ++DaysInYear;
                      }

                      if (Days < DaysInYear)
                      {
                          break;
                      }

                      Days -= DaysInYear;
                      ++Year;
                  }

                  Time->tm_year = (int)Year - 1900;
                  Time->tm_yday = (int)Days;
                  Time->tm_hour = (int)(SecondsOfDay / 3600);
                  SecondsOfDay %= 3600;
                  Time->tm_min = (int)(SecondsOfDay / 60);
                  Time->tm_sec = (int)(SecondsOfDay % 60);
              }

              CFE_Status_t CFE_TIME_Print(char *PrintBuffer, CFE_TIME_SysTime_t TimeToPrint)
              {
                  size_t    FmtLen = 0;
                  uint32    Micros = (CFE_TIME_Sub2MicroSecs(TimeToPrint.Subseconds) + CFE_MISSION_TIME_EPOCH_MICROS) / 10;
                  uint64    UnixSeconds;
                  struct tm tm = { 0 };

                  if (PrintBuffer == NULL)
                  {
                      return CFE_TIME_BAD_ARGUMENT;
                  }

                  UnixSeconds = (uint64)TimeToPrint.Seconds + (uint64)CFE_MISSION_TIME_EPOCH_SECONDS;
                  CFE_TIME_UnixSecondsToTm(&tm, UnixSeconds);

                  FmtLen = strftime(PrintBuffer, CFE_TIME_PRINTED_STRING_SIZE - 6, "%Y-%j-%H:%M:%S", &tm);
                  if (FmtLen == 0)
                  {
                      return CFE_TIME_BAD_ARGUMENT;
                  }

                  PrintBuffer      += FmtLen;
                  *(PrintBuffer++)  = '.';

                  *(PrintBuffer++) = '0' + (char)((Micros % 100000) / 10000);
                  *(PrintBuffer++) = '0' + (char)((Micros % 10000) / 1000);
                  *(PrintBuffer++) = '0' + (char)((Micros % 1000) / 100);
                  *(PrintBuffer++) = '0' + (char)((Micros % 100) / 10);
                  *(PrintBuffer++) = '0' + (char)(Micros % 10);
                  *PrintBuffer     = '\\0';
                  return CFE_SUCCESS;
              }
          """).strip()
          api.write_text(text[:start] + new + text[end:])

          test = Path("modules/time/ut-coverage/time_UT.c")
          text = test.read_text()
          test_start = text.index("void Test_Print(void)")
          tail = "\n}\n\n/*\n** Test function for use with register and unregister synch callback API tests"
          insert_at = text.index(tail, test_start)
          extra = textwrap.dedent("""

              /* Test the maximum seconds value, including the 2100 non-leap-century boundary */
              time.Subseconds = 0;
              time.Seconds    = 0xffffffff;

              CFE_UtAssert_SUCCESS(CFE_TIME_Print(timeBuf, time));
              if (usingDefaultEpoch)
              {
                  strcpy(expectedBuf, "2116-038-06:28:15.00000");
                  UtAssert_STRINGBUF_EQ(timeBuf, sizeof(timeBuf), expectedBuf, sizeof(expectedBuf));
              }
              else
              {
                  UtAssert_MIR("Confirm adding seconds = %u, subseconds = %u to configured EPOCH results in time %s",
                               (unsigned int)time.Seconds,
                               (unsigned int)time.Subseconds,
                               timeBuf);
              }
          """).rstrip()
          test.write_text(text[:insert_at] + extra + text[insert_at:])

      - name: Check patch whitespace
        run: git diff --check

      - name: Remove one-off workflow
        run: rm .github/workflows/apply-fix-2782.yml

      - name: Commit patch
        run: |
          git config user.name "Sylvester Kaczmarek"
          git config user.email "16242628+sylvesterkaczmarek@users.noreply.github.com"
          git add modules/time/fsw/src/cfe_time_api.c modules/time/ut-coverage/time_UT.c .github/workflows/apply-fix-2782.yml
          git commit -m "Fix #2782, make TIME print independent of time_t width"
          git push origin HEAD:fix-2782-time-print-32bit
