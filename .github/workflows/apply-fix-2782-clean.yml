name: Apply fix 2782 clean

on:
  push:
    branches:
      - fix-2782-time-print-32bit-clean

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix-2782-time-print-32bit-clean
      - name: Apply source and regression changes
        shell: python
        env:
          NEW_FUNCTION_B64: 
          EXTRA_TEST_B64: 
        run: |
          import base64
          import os
          from pathlib import Path

          api = Path("modules/time/fsw/src/cfe_time_api.c")
          text = api.read_text()
          start = text.index("CFE_Status_t CFE_TIME_Print(")
          end = text.index("\n}\n\n/*----------------------------------------------------------------", start) + 2
          replacement = base64.b64decode(os.environ["NEW_FUNCTION_B64"]).decode()
          api.write_text(text[:start] + replacement + text[end:])

          test = Path("modules/time/ut-coverage/time_UT.c")
          text = test.read_text()
          start = text.index("void Test_Print(void)")
          marker = "\n}\n\n/*\n** Test function for use with register and unregister synch callback API tests"
          end = text.index(marker, start)
          extra = base64.b64decode(os.environ["EXTRA_TEST_B64"]).decode()
          test.write_text(text[:end] + extra + text[end:])
      - name: Verify and commit
        run: |
          git diff --check
          rm .github/workflows/apply-fix-2782-clean.yml
          git config user.name "Sylvester Kaczmarek"
          git config user.email "16242628+sylvesterkaczmarek@users.noreply.github.com"
          git add -A
          git commit -m "Fix #2782, make TIME print independent of time_t width"
          git push origin HEAD:fix-2782-time-print-32bit-clean
